services:
  backend:
    # En la VPS la imagen llega desde GHCR (la define el CI con BACKEND_IMAGE).
    # En local, si no esta definida, se construye desde el Dockerfile.
    image: ${BACKEND_IMAGE:-deploy-con-suero-backend:local}
    build: .
    container_name: backend
    restart: unless-stopped
    # Configuracion de Open Payments: el .env no se hornea en la imagen,
    # se inyecta al contenedor en tiempo de arranque.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Pisa OP_PRIVATE_KEY_PATH del .env: dentro del contenedor la llave
      # privada es un secreto montado de solo lectura.
      OP_PRIVATE_KEY_PATH: /run/secrets/op_private_key
    volumes:
      # El archivo DEBE existir antes del `up`, o Docker crea un directorio
      # con ese nombre y el arranque falla con "no es un PEM PKCS#8".
      - ./secrets/private.key:/run/secrets/op_private_key:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(process.env.PORT||3000).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
