services:
  frontend:
    # En la VPS la imagen llega desde GHCR (la define el CI con FRONTEND_IMAGE).
    # En local, si no esta definida, se construye desde el Dockerfile.
    image: ${FRONTEND_IMAGE:-deploy-con-suero-frontend:local}
    build: .
    container_name: frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
    # Solo escucha en loopback: el unico que entra es el nginx del host.
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"
