name: CI/CD Frontend (Docker)

on:
  push:
    branches: [frontend]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  # ---------- Stage 1: construir la imagen React y publicarla en GHCR ----------
  build:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Stage 2: desplegar en la VPS con docker compose ----------
  deploy:
    name: Deploy a VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # El frontend se despliega en la subcarpeta "frontend" de VPS_APP_PATH,
      # para no pisar al backend que usa la raiz de ese mismo secreto.
      - name: Preparar carpeta en la VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            APP_DIR=$(printf '%s' "${{ secrets.VPS_APP_PATH }}" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
            case "$APP_DIR" in "~"*) APP_DIR="$HOME${APP_DIR#\~}" ;; esac
            if [ -z "$APP_DIR" ]; then
              echo "VPS_APP_PATH esta vacio. Definilo en los secretos del repo."
              exit 1
            fi
            mkdir -p "$APP_DIR/frontend"
            echo "Carpeta de despliegue lista: $APP_DIR/frontend"
            docker --version
            docker compose version

      - name: Copiar docker-compose.yml a la VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: docker-compose.yml
          target: ${{ secrets.VPS_APP_PATH }}/frontend

      - name: Pull & up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: false
          script: |
            set -e
            APP_DIR=$(printf '%s' "${{ secrets.VPS_APP_PATH }}" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
            case "$APP_DIR" in "~"*) APP_DIR="$HOME${APP_DIR#\~}" ;; esac
            mkdir -p "$APP_DIR/frontend"
            cd "$APP_DIR/frontend"

            echo "==> Login en GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export FRONTEND_IMAGE="${{ env.IMAGE }}:${{ github.sha }}"
            export FRONTEND_HOST_PORT="${{ secrets.FRONTEND_HOST_PORT }}"
            : "${FRONTEND_HOST_PORT:=80}"
            echo "==> Desplegando $FRONTEND_IMAGE en el puerto $FRONTEND_HOST_PORT"

            docker compose pull
            docker compose up -d --no-build --remove-orphans

            echo "==> Limpiando imagenes viejas"
            docker image prune -f

            docker compose ps
            docker logout ghcr.io
