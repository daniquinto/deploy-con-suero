name: CI/CD Backend (Docker)

on:
  push:
    branches: [backend]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}-backend

jobs:
  # ---------- Stage 1: construir la imagen y publicarla en GHCR ----------
  build:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Stage 2: desplegar en la VPS con docker compose ----------
  deploy:
    name: Deploy a VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # Normaliza la ruta (quita saltos de linea y espacios sobrantes del
      # secreto, expande un ~ inicial) y se asegura de que la carpeta exista.
      - name: Preparar carpeta en la VPS
        id: prep
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            APP_DIR=$(printf '%s' "${{ secrets.VPS_APP_PATH }}" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
            case "$APP_DIR" in "~"*) APP_DIR="$HOME${APP_DIR#\~}" ;; esac
            if [ -z "$APP_DIR" ]; then
              echo "VPS_APP_PATH esta vacio. Definilo en los secretos del repo."
              exit 1
            fi
            mkdir -p "$APP_DIR"
            echo "Carpeta de despliegue lista: $APP_DIR"
            docker --version
            docker compose version

      - name: Copiar docker-compose.yml a la VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: docker-compose.yml
          target: ${{ secrets.VPS_APP_PATH }}

      - name: Pull & up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: false
          script: |
            set -e
            APP_DIR=$(printf '%s' "${{ secrets.VPS_APP_PATH }}" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
            case "$APP_DIR" in "~"*) APP_DIR="$HOME${APP_DIR#\~}" ;; esac
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "==> Login en GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export BACKEND_IMAGE="${{ env.IMAGE }}:${{ github.sha }}"
            export HOST_PORT="${{ secrets.HOST_PORT }}"
            : "${HOST_PORT:=3000}"
            echo "==> Desplegando $BACKEND_IMAGE en el puerto $HOST_PORT"

            # Un contenedor viejo (de otra definicion o de un run manual)
            # puede seguir reteniendo el puerto. Se libera antes de levantar.
            echo "==> Liberando el puerto $HOST_PORT si quedo tomado"
            docker compose down --remove-orphans 2>/dev/null || true
            STALE=$(docker ps -aq --filter "publish=$HOST_PORT")
            if [ -n "$STALE" ]; then
              echo "Removiendo contenedores que retienen el puerto: $STALE"
              docker rm -f $STALE
            fi

            docker compose pull
            docker compose up -d --no-build --remove-orphans

            echo "==> Limpiando imagenes viejas"
            docker image prune -f

            docker compose ps
            docker logout ghcr.io
