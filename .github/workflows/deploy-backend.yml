name: CI/CD Backend

on:
  push:
    branches: [backend]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  # ---------- Stage 1: build & checks (tolerante: no rompe el pipeline) ----------
  build:
    name: Build & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          elif [ -f package.json ]; then
            npm install
          else
            echo "Todavia no hay package.json, se omite la instalacion."
          fi

      - name: Lint
        continue-on-error: true
        run: |
          if [ -f package.json ] && npm run | grep -q '^  lint'; then
            npm run lint
          else
            echo "Sin script de lint, se omite."
          fi

      - name: Tests
        continue-on-error: true
        run: |
          if [ -f package.json ] && npm run | grep -q '^  test'; then
            npm test
          else
            echo "Sin tests todavia, se omite."
          fi

  # ---------- Stage 2: deploy a la VPS por SSH ----------
  deploy:
    name: Deploy a VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: false
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_PATH }}"
            cd "$APP_DIR"

            echo "==> Actualizando codigo"
            git fetch origin backend
            git reset --hard origin/backend

            echo "==> Instalando dependencias"
            if [ -f package-lock.json ]; then
              npm ci --omit=dev || npm install --omit=dev
            elif [ -f package.json ]; then
              npm install --omit=dev
            else
              echo "Sin package.json, se omite."
            fi

            echo "==> Reiniciando aplicacion"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload backend || pm2 start npm --name backend -- start
              pm2 save || true
            else
              echo "pm2 no instalado; reinicia el servicio manualmente."
            fi

            echo "==> Deploy terminado"
